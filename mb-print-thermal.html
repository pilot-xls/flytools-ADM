<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>D228 - Mass & Balance (Térmica 80mm)</title>
        <link href="css/theme.css" rel="stylesheet">
        <link href="css/mb.css" rel="stylesheet">
        <link href="css/mb-print-thermal.css" rel="stylesheet">
    </head>
    <body class="mb-thermal-body">
        <div class="mb-thermal-toolbar">
            <div id="btnShareThermalImageWrap" class="mb-thermal-toolbar-item" hidden>
                <button id="btnShareThermalImage" type="button" class="btn mb-thermal-icon-btn" aria-label="Partilhar PDF" title="Partilhar PDF">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </button>
                <span class="mb-thermal-btn-label">share</span>
            </div>
            <div class="mb-thermal-toolbar-item">
                <button id="btnClosePrint" type="button" class="btn btn-secondary mb-thermal-icon-btn" aria-label="Fechar" title="Fechar">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
                <span class="mb-thermal-btn-label">exit</span>
            </div>
        </div>

        <!-- Pré-visualização do PDF gerado automaticamente ao abrir a página. -->
        <div id="mbThermalPreviewWrap" class="mb-thermal-preview-wrap" hidden>
            <canvas id="mbThermalPreviewCanvas" class="mb-thermal-preview-canvas" aria-label="Pré-visualização do talão em PDF"></canvas>
        </div>

        <!-- Fonte dos dados usados para construir o PDF acima (js/mb-print-thermal.js
             lê estes elementos). Fica sempre invisível ao utilizador — não é
             ecrã de conferência, só a "matéria-prima" do talão. -->
        <main class="mb-thermal-source" aria-hidden="true">
            <section id="mbPrintCapture" class="mb-thermal-capture">
                <div id="mb-table">
                    <div id="heading">
                        <img id="thermalLogo" src="img/sevenair.png" loading="eager" alt="Sevenair logo" class="mb-thermal-logo">
                        <h2>Weight &amp; Balance</h2>
                        <p id="ac-selected"></p>
                        <p id="nomeLeg"></p>
                        <div id="mbPrintTimestamp" aria-live="polite"></div>
                    </div>
                    <table class="mb-table">
                        <thead>
                            <tr>
                                <th scope="col" id="thead-item">Item</th>
                                <th scope="col">Weight (kg)</th>
                                <th scope="col">Moment (kg&middot;m)</th>
                                <th scope="col" id="thead-info">INFO</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Basic weight</td>
                                <td id="basicWeight">0</td>
                                <td id="basicMoment">0</td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="pilots">Pilots</label>
                                </td>
                                <td>
                                    <input id="pilots" class="popup-fuel" type="number" inputmode="numeric" step="any" value="150">
                                </td>
                                <td id="momentPilots">0</td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="manualPayload">Payload</label>
                                </td>
                                <td>
                                    <input id="manualPayload" class="popup-fuel" type="number" inputmode="numeric" step="any" value="0">
                                    <input type="hidden" id="momentPayloadInput">
                                </td>
                                <td id="momentPayload">0</td>
                                <td id="Info-maxfuel"></td>
                            </tr>
                            <tr class="gray-row">
                                <td>ZFW</td>
                                <td id="zfw">0</td>
                                <td id="momentZfw">0</td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="fuel">Fuel loading</label>
                                </td>
                                <td>
                                    <input id="fuel" class="popup-fuel" type="number" inputmode="numeric" step="any" value="0">
                                </td>
                                <td id="momentFuel">0</td>
                                <td id="Info-maxpayload"></td>
                            </tr>
                            <tr id="rampRow" class="gray-row">
                                <td>Ramp Weight</td>
                                <td id="rampWeight" class="limit-check">0</td>
                                <td id="momentRamp">0</td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="fuelTaxi">Fuel taxi</label>
                                </td>
                                <td>
                                    <input id="fuelTaxi" class="popup-fuel" type="number" inputmode="numeric" step="any" value="30">
                                </td>
                                <td id="momentTaxi">0</td>
                                <td></td>
                            </tr>
                            <tr id="takeoffRow" class="gray-row">
                                <td>Take-off Weight</td>
                                <td id="takeoffWeight" class="limit-check">0</td>
                                <td id="momentTakeoff">0</td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="fuelDest">Fuel to destination</label>
                                </td>
                                <td>
                                    <input id="fuelDest" class="popup-fuel" type="number" inputmode="numeric" step="any" value="0">
                                </td>
                                <td id="momentDest">0</td>
                                <td></td>
                            </tr>
                            <tr id="landingRow" class="gray-row">
                                <td>Landing Weight</td>
                                <td id="landingWeight" class="limit-check">0</td>
                                <td id="momentLanding">0</td>
                                <td></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div id="loadsheet-img" class="mb-thermal-envelope">
                    <img id="loadsheet-base" loading="eager" fetchpriority="high" alt="Envelope CG">
                    <svg id="cg-svg" viewBox="0 0 400 300"></svg>
                </div>
            </section>
        </main>

        <script src="js/general.js"></script>
        <script src="js/dataLoader.js"></script>
        <script src="js/mb.js"></script>
        <script src="js/vendor/jspdf.umd.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js';"></script>
        <script src="js/vendor/pdf.min.js"></script>
        <script src="js/mb-print-thermal.js"></script>
    </body>
</html>
